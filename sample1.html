<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>英単語学習アプリ</title>
    <script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
    <script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState } = React;

        // 100個の英単語データ
        const vocabData = [
          { en: "abandon", ja: "放棄する" },
          { en: "ability", ja: "能力" },
          { en: "abroad", ja: "海外で" },
          { en: "absence", ja: "不在" },
          { en: "absolute", ja: "絶対的な" },
          { en: "absorb", ja: "吸収する" },
          { en: "abstract", ja: "抽象的な" },
          { en: "abundant", ja: "豊富な" },
          { en: "accept", ja: "受け入れる" },
          { en: "access", ja: "アクセス" },
          { en: "accident", ja: "事故" },
          { en: "accompany", ja: "同行する" },
          { en: "accomplish", ja: "達成する" },
          { en: "according", ja: "従って" },
          { en: "account", ja: "口座、説明" },
          { en: "accurate", ja: "正確な" },
          { en: "achieve", ja: "達成する" },
          { en: "acknowledge", ja: "認める" },
          { en: "acquire", ja: "獲得する" },
          { en: "adapt", ja: "適応する" },
          { en: "adequate", ja: "適切な" },
          { en: "adjust", ja: "調整する" },
          { en: "admire", ja: "賞賛する" },
          { en: "admit", ja: "認める" },
          { en: "adopt", ja: "採用する" },
          { en: "advance", ja: "前進する" },
          { en: "advantage", ja: "利点" },
          { en: "adventure", ja: "冒険" },
          { en: "advertise", ja: "広告する" },
          { en: "advice", ja: "助言" },
          { en: "affair", ja: "出来事" },
          { en: "affect", ja: "影響する" },
          { en: "afford", ja: "余裕がある" },
          { en: "agency", ja: "機関" },
          { en: "agent", ja: "代理人" },
          { en: "aggressive", ja: "攻撃的な" },
          { en: "agriculture", ja: "農業" },
          { en: "aim", ja: "目的" },
          { en: "alarm", ja: "警報" },
          { en: "album", ja: "アルバム" },
          { en: "alcohol", ja: "アルコール" },
          { en: "alert", ja: "警戒" },
          { en: "alike", ja: "似ている" },
          { en: "alive", ja: "生きている" },
          { en: "allow", ja: "許可する" },
          { en: "almost", ja: "ほとんど" },
          { en: "alone", ja: "一人で" },
          { en: "along", ja: "沿って" },
          { en: "aloud", ja: "声に出して" },
          { en: "already", ja: "すでに" },
          { en: "alternative", ja: "代替の" },
          { en: "although", ja: "しかし" },
          { en: "altitude", ja: "高度" },
          { en: "altogether", ja: "完全に" },
          { en: "always", ja: "常に" },
          { en: "amateur", ja: "アマチュア" },
          { en: "amaze", ja: "驚かせる" },
          { en: "ambition", ja: "野心" },
          { en: "amount", ja: "量" },
          { en: "amuse", ja: "楽しませる" },
          { en: "analyze", ja: "分析する" },
          { en: "ancestor", ja: "祖先" },
          { en: "ancient", ja: "古代の" },
          { en: "anger", ja: "怒り" },
          { en: "angle", ja: "角度" },
          { en: "announce", ja: "発表する" },
          { en: "annoy", ja: "いらいらさせる" },
          { en: "annual", ja: "年次の" },
          { en: "answer", ja: "答え" },
          { en: "anticipate", ja: "予想する" },
          { en: "anxiety", ja: "不安" },
          { en: "anxious", ja: "心配な" },
          { en: "apart", ja: "離れて" },
          { en: "apologize", ja: "謝罪する" },
          { en: "apparent", ja: "明らかな" },
          { en: "appeal", ja: "訴える" },
          { en: "appear", ja: "現れる" },
          { en: "appetite", ja: "食欲" },
          { en: "applaud", ja: "拍手する" },
          { en: "apply", ja: "適用する" },
          { en: "appoint", ja: "任命する" },
          { en: "appreciate", ja: "感謝する" },
          { en: "approach", ja: "接近する" },
          { en: "appropriate", ja: "適切な" },
          { en: "approve", ja: "承認する" },
          { en: "approximate", ja: "おおよその" },
          { en: "architect", ja: "建築家" },
          { en: "argue", ja: "議論する" },
          { en: "arise", ja: "生じる" },
          { en: "arrange", ja: "配置する" },
          { en: "arrest", ja: "逮捕する" },
          { en: "arrive", ja: "到着する" },
          { en: "article", ja: "記事" },
          { en: "artificial", ja: "人工的な" },
          { en: "artist", ja: "芸術家" },
          { en: "ascend", ja: "上昇する" },
          { en: "ashamed", ja: "恥じて" },
          { en: "aside", ja: "脇へ" },
          { en: "aspect", ja: "側面" }
        ];

        // SVGアイコンコンポーネント
        const ChevronLeft = () => (
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2">
            <polyline points="15 18 9 12 15 6"></polyline>
          </svg>
        );

        const BookOpen = () => (
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2">
            <path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"></path>
            <path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"></path>
          </svg>
        );

        const CheckCircle = () => (
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2">
            <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path>
            <polyline points="22 4 12 14.01 9 11.01"></polyline>
          </svg>
        );

        const Target = () => (
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2">
            <circle cx="12" cy="12" r="10"></circle>
            <circle cx="12" cy="12" r="6"></circle>
            <circle cx="12" cy="12" r="2"></circle>
          </svg>
        );

        const App = () => {
          const [mode, setMode] = useState('en-ja');
          const [page, setPage] = useState('menu');
          const [revealed, setRevealed] = useState({});
          
          const [quizQuestions, setQuizQuestions] = useState([]);
          const [currentQ, setCurrentQ] = useState(0);
          const [selectedAnswer, setSelectedAnswer] = useState(null);
          const [answers, setAnswers] = useState([]);
          const [showResult, setShowResult] = useState(false);
          const [showAnswerFeedback, setShowAnswerFeedback] = useState(false);

          const generateQuiz = (count) => {
            const shuffled = [...vocabData].sort(() => Math.random() - 0.5);
            const selected = shuffled.slice(0, count);
            
            const questions = selected.map(q => {
              const wrongChoices = vocabData
                .filter(v => v !== q)
                .sort(() => Math.random() - 0.5)
                .slice(0, 3);
              
              const choices = [...wrongChoices, q].sort(() => Math.random() - 0.5);
              return { question: q, choices };
            });
            
            setQuizQuestions(questions);
            setCurrentQ(0);
            setSelectedAnswer(null);
            setAnswers([]);
            setShowResult(false);
          };

          const handleAnswerSelect = (choice) => {
            if (showAnswerFeedback) return; // フィードバック表示中は選択不可
            setSelectedAnswer(choice);
            setShowAnswerFeedback(true);
          };

          const handleNextQuestion = () => {
            const isCorrect = selectedAnswer === quizQuestions[currentQ].question;
            setAnswers([...answers, isCorrect]);
            
            if (currentQ + 1 < quizQuestions.length) {
              setCurrentQ(currentQ + 1);
              setSelectedAnswer(null);
              setShowAnswerFeedback(false);
            } else {
              setShowResult(true);
            }
          };

          const resetQuiz = () => {
            setPage('menu');
            setQuizQuestions([]);
            setCurrentQ(0);
            setSelectedAnswer(null);
            setAnswers([]);
            setShowResult(false);
            setShowAnswerFeedback(false);
          };

          const toggleReveal = (index) => {
            setRevealed(prev => ({ ...prev, [index]: !prev[index] }));
          };

          if (page === 'menu') {
            return (
              <div className="min-h-screen bg-gradient-to-br from-blue-50 to-indigo-100 p-4">
                <div className="flex justify-between items-center mb-8 pt-4">
                  <h1 className="text-2xl font-bold text-gray-800">英単語学習</h1>
                  <div className="flex items-center gap-2 bg-white rounded-full px-4 py-2 shadow-md">
                    <span className={`text-sm font-medium ${mode === 'en-ja' ? 'text-blue-600' : 'text-gray-400'}`}>英→日</span>
                    <button
                      onClick={() => setMode(mode === 'en-ja' ? 'ja-en' : 'en-ja')}
                      className="relative w-12 h-6 bg-blue-600 rounded-full transition-colors"
                    >
                      <div className={`absolute top-0.5 ${mode === 'en-ja' ? 'left-0.5' : 'left-6'} w-5 h-5 bg-white rounded-full transition-transform`}></div>
                    </button>
                    <span className={`text-sm font-medium ${mode === 'ja-en' ? 'text-blue-600' : 'text-gray-400'}`}>日→英</span>
                  </div>
                </div>

                <div className="max-w-md mx-auto space-y-4">
                  <button
                    onClick={() => { setPage('list'); setRevealed({}); }}
                    className="w-full bg-white rounded-2xl p-6 shadow-lg hover:shadow-xl transition-shadow flex items-center gap-4"
                  >
                    <div className="bg-blue-100 p-3 rounded-full">
                      <BookOpen />
                    </div>
                    <div className="text-left">
                      <div className="font-bold text-lg text-gray-800">一覧表示</div>
                      <div className="text-sm text-gray-500">100個の単語を確認</div>
                    </div>
                  </button>

                  <button
                    onClick={() => { setPage('quiz10'); generateQuiz(10); }}
                    className="w-full bg-white rounded-2xl p-6 shadow-lg hover:shadow-xl transition-shadow flex items-center gap-4"
                  >
                    <div className="bg-green-100 p-3 rounded-full">
                      <CheckCircle />
                    </div>
                    <div className="text-left">
                      <div className="font-bold text-lg text-gray-800">10問チェック</div>
                      <div className="text-sm text-gray-500">ランダムに10問出題</div>
                    </div>
                  </button>

                  <button
                    onClick={() => { setPage('quiz100'); generateQuiz(100); }}
                    className="w-full bg-white rounded-2xl p-6 shadow-lg hover:shadow-xl transition-shadow flex items-center gap-4"
                  >
                    <div className="bg-purple-100 p-3 rounded-full">
                      <Target />
                    </div>
                    <div className="text-left">
                      <div className="font-bold text-lg text-gray-800">全問チェック</div>
                      <div className="text-sm text-gray-500">100問すべてに挑戦</div>
                    </div>
                  </button>
                </div>
              </div>
            );
          }

          if (page === 'list') {
            return (
              <div className="min-h-screen bg-gradient-to-br from-blue-50 to-indigo-100 p-4">
                <div className="flex items-center gap-3 mb-6 pt-4">
                  <button onClick={() => setPage('menu')} className="p-2 hover:bg-white rounded-full">
                    <ChevronLeft />
                  </button>
                  <h1 className="text-2xl font-bold text-gray-800">一覧表示</h1>
                  <span className="ml-auto bg-blue-600 text-white text-sm px-3 py-1 rounded-full">
                    {mode === 'en-ja' ? '英→日' : '日→英'}
                  </span>
                </div>

                <div className="max-w-2xl mx-auto space-y-2">
                  {vocabData.map((vocab, idx) => (
                    <button
                      key={idx}
                      onClick={() => toggleReveal(idx)}
                      className="w-full bg-white rounded-xl p-4 shadow hover:shadow-md transition-shadow text-left"
                    >
                      <div className="font-medium text-lg text-gray-800">
                        {mode === 'en-ja' ? vocab.en : vocab.ja}
                      </div>
                      {revealed[idx] && (
                        <div className="mt-2 text-blue-600 font-medium">
                          {mode === 'en-ja' ? vocab.ja : vocab.en}
                        </div>
                      )}
                    </button>
                  ))}
                </div>
              </div>
            );
          }

          if (page === 'quiz10' || page === 'quiz100') {
            if (showResult) {
              const correctCount = answers.filter(a => a).length;
              const total = answers.length;
              const percentage = Math.round((correctCount / total) * 100);

              return (
                <div className="min-h-screen bg-gradient-to-br from-blue-50 to-indigo-100 p-4 flex items-center justify-center">
                  <div className="bg-white rounded-2xl p-8 shadow-xl max-w-md w-full">
                    <div className="text-center">
                      <div className="text-6xl font-bold text-blue-600 mb-4">
                        {correctCount}/{total}
                      </div>
                      <div className="text-2xl font-bold text-gray-800 mb-2">
                        正解率: {percentage}%
                      </div>
                      <div className="text-gray-600 mb-8">
                        {percentage >= 80 ? '素晴らしい!' : percentage >= 60 ? 'よくできました!' : 'もう少し頑張りましょう!'}
                      </div>
                      <button
                        onClick={resetQuiz}
                        className="w-full bg-blue-600 text-white font-bold py-3 rounded-xl hover:bg-blue-700 transition-colors"
                      >
                        メニューに戻る
                      </button>
                    </div>
                  </div>
                </div>
              );
            }

            const q = quizQuestions[currentQ];
            const questionText = mode === 'en-ja' ? q.question.en : q.question.ja;
            const isCorrect = selectedAnswer === q.question;

            return (
              <div className="min-h-screen bg-gradient-to-br from-blue-50 to-indigo-100 p-4">
                <div className="max-w-2xl mx-auto pt-4">
                  <div className="flex justify-between items-center mb-6">
                    <button onClick={resetQuiz} className="p-2 hover:bg-white rounded-full">
                      <ChevronLeft />
                    </button>
                    <span className="text-lg font-bold text-gray-700">
                      {currentQ + 1} / {quizQuestions.length}
                    </span>
                    <span className="bg-blue-600 text-white text-sm px-3 py-1 rounded-full">
                      {mode === 'en-ja' ? '英→日' : '日→英'}
                    </span>
                  </div>

                  <div className="bg-white rounded-2xl p-8 shadow-xl mb-6">
                    <div className="text-3xl font-bold text-center text-gray-800 mb-8">
                      {questionText}
                    </div>

                    <div className="space-y-3">
                      {q.choices.map((choice, idx) => {
                        const choiceText = mode === 'en-ja' ? choice.ja : choice.en;
                        const isSelected = selectedAnswer === choice;
                        const isCorrectChoice = choice === q.question;
                        
                        let buttonClass = 'bg-gray-50 text-gray-800 hover:bg-gray-100';
                        
                        if (showAnswerFeedback) {
                          if (isSelected && isCorrect) {
                            buttonClass = 'bg-green-500 text-white shadow-lg';
                          } else if (isSelected && !isCorrect) {
                            buttonClass = 'bg-red-500 text-white shadow-lg';
                          } else if (isCorrectChoice) {
                            buttonClass = 'bg-green-100 border-2 border-green-500 text-gray-800';
                          }
                        } else if (isSelected) {
                          buttonClass = 'bg-blue-600 text-white shadow-lg';
                        }
                        
                        return (
                          <button
                            key={idx}
                            onClick={() => handleAnswerSelect(choice)}
                            className={`w-full p-4 rounded-xl text-left font-medium transition-all ${buttonClass}`}
                            disabled={showAnswerFeedback}
                          >
                            {choiceText}
                          </button>
                        );
                      })}
                    </div>

                    {showAnswerFeedback && (
                      <div className={`mt-6 p-4 rounded-xl text-center font-bold text-lg ${
                        isCorrect ? 'bg-green-100 text-green-800' : 'bg-red-100 text-red-800'
                      }`}>
                        {isCorrect ? '✓ 正解！' : '✗ 不正解'}
                      </div>
                    )}
                  </div>

                  <button
                    onClick={handleNextQuestion}
                    disabled={!selectedAnswer}
                    className={`w-full py-4 rounded-xl font-bold text-lg transition-colors ${
                      selectedAnswer
                        ? 'bg-blue-600 text-white hover:bg-blue-700'
                        : 'bg-gray-300 text-gray-500 cursor-not-allowed'
                    }`}
                  >
                    {currentQ + 1 === quizQuestions.length ? '結果を見る' : '次へ'}
                  </button>
                </div>
              </div>
            );
          }

          return null;
        };

        ReactDOM.render(<App />, document.getElementById('root'));
    </script>
</body>
</html>
